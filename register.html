<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Регистрация</h1>

        <form id="register-form">
            <input id="register-login" type="text" placeholder="Логин" required>
            <input id="register-name" type="text" placeholder="Имя" required>
            <input id="register-password" type="password" placeholder="Пароль" required>
            <button type="submit">Зарегистрироваться</button>
        </form>

        <p id="register-error"></p>
        <a href="login.html">Уже есть аккаунт? Войти</a>
    </div>

    <script type="module" src="register.js"></script>
</body>
</html>
