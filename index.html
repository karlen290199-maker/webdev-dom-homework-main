<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";

    const commentsData = [
      {
        id: 1,
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        text: "Это будет первый комментарий на этой странице",
        likes: 3,
        isLiked: false
      },
      {
        id: 2,
        name: "Варвара Н.",
        date: "13.02.22 19:22",
        text: "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLiked: true
      }
    ];

    let nextId = 3;

    function renderComments() {
      const commentsList = document.querySelector('.comments');
      
      commentsList.innerHTML = '';
      
      commentsData.forEach((comment, index) => {
        const li = document.createElement('li');
        li.className = 'comment';
        li.dataset.index = index;
        
        const header = document.createElement('div');
        header.className = 'comment-header';
        
        const nameDiv = document.createElement('div');
        nameDiv.textContent = comment.name;
        
        const dateDiv = document.createElement('div');
        dateDiv.textContent = comment.date;
        
        header.appendChild(nameDiv);
        header.appendChild(dateDiv);
        
        const body = document.createElement('div');
        body.className = 'comment-body';
        
        const textDiv = document.createElement('div');
        textDiv.className = 'comment-text';
        textDiv.textContent = comment.text;
        
        body.appendChild(textDiv);
        
        const footer = document.createElement('div');
        footer.className = 'comment-footer';
        
        const likes = document.createElement('div');
        likes.className = 'likes';
        
        const counter = document.createElement('span');
        counter.className = 'likes-counter';
        counter.textContent = comment.likes;
        
        const likeBtn = document.createElement('button');
        likeBtn.className = comment.isLiked ? 'like-button -active-like' : 'like-button';
        likeBtn.dataset.index = index;
        
        likes.appendChild(counter);
        likes.appendChild(likeBtn);
        footer.appendChild(likes);
        
        li.appendChild(header);
        li.appendChild(body);
        li.appendChild(footer);
        
        commentsList.appendChild(li);
      });
    }

    function handleLikeClick(event) {
      const button = event.target;
      
      if (!button.classList.contains('like-button')) return;
      
      const index = parseInt(button.dataset.index);
      const comment = commentsData[index];
      
      if (comment.isLiked) {
        comment.isLiked = false;
        comment.likes -= 1;
      } else {
        comment.isLiked = true;
        comment.likes += 1;
      }
      
      renderComments();

      attachLikeListeners();
    }

    function attachLikeListeners() {
      const likeButtons = document.querySelectorAll('.like-button');
      likeButtons.forEach(button => {
        button.addEventListener('click', handleLikeClick);
      });
    }

    function getCurrentDate() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = String(now.getFullYear()).slice(-2);
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function addComment() {
      const nameInput = document.querySelector('.add-form-name');
      const textInput = document.querySelector('.add-form-text');
      
      const name = nameInput.value.trim();
      const text = textInput.value.trim();
      
      if (!name || !text) {
        alert('Пожалуйста, заполните имя и комментарий');
        return;
      }
      
      commentsData.push({
        id: nextId++,
        name: name,
        date: getCurrentDate(),
        text: text,
        likes: 0,
        isLiked: false
      });
      
      nameInput.value = '';
      textInput.value = '';
      
      renderComments();
      attachLikeListeners();
    }

    function init() {
      renderComments();
      
      attachLikeListeners();
      
      const addButton = document.querySelector('.add-form-button');
      addButton.addEventListener('click', addComment);
      
      const textInput = document.querySelector('.add-form-text');
      textInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          addComment();
        }
      });
    }

    init();
  </script>
</html>
