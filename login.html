<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Вход</h1>

        <form id="login-form" class="add-form">
            <input id="login" class="add-form-name"
                placeholder="Логин" required>

            <input id="password" class="add-form-name"
                type="password" placeholder="Пароль" required>

            <button class="add-form-button" type="submit">
                Войти
            </button>

            <p id="error-message"></p>
        </form>

        <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        <p><a href="index.html">Вернуться к комментариям</a></p>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
